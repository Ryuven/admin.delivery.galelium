<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>dastdaroz Admin — Вход</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap"/>
<style>
:root{
  --bg:#0c0c0c;--s1:#161616;--s2:#1e1e1e;--s3:#262626;
  --b:rgba(255,255,255,.07);--bh:rgba(255,255,255,.13);
  --red:#f43f5e;--redd:rgba(244,63,94,.09);
  --green:#34d399;--amber:#fbbf24;
  --tx:#f0f0f0;--tx2:#888;--tx3:#505050;
  --fd:'Nunito',sans-serif;--fm:'DM Mono',monospace;--fs:'Inter',system-ui,sans-serif;
  --ease:cubic-bezier(.32,0,.18,1);--tf:.14s;--r:11px;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--tx);font-family:var(--fs);
  min-height:100svh;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;
}

/* ── Progress bar ── */
.fb-bar{
  position:fixed;top:0;left:0;right:0;height:2px;z-index:999;
  background:#fff;transform-origin:left;transform:scaleX(0);
  transition:transform .4s var(--ease);
}
.fb-bar.loading{transform:scaleX(.6)}
.fb-bar.done{transform:scaleX(1);opacity:0;transition:transform .2s,opacity .3s ease .2s}

/* ── Wrap ── */
.wrap{
  width:min(400px,calc(100vw - 40px));
  display:flex;flex-direction:column;
  animation:fadeUp .32s var(--ease) both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── Logo ── */
.logo{display:flex;justify-content:center;margin-bottom:30px}
.logo img{height:46px;width:auto;object-fit:contain;filter:brightness(0) invert(1) opacity(.9)}

/* ── Admin badge ── */
.admin-badge{display:flex;justify-content:center;margin-bottom:32px}
.badge-inner{
  display:inline-flex;align-items:center;gap:7px;
  padding:4px 13px 4px 9px;
  background:var(--s2);border:1px solid var(--b);border-radius:99px;
  font-family:var(--fm);font-size:.58rem;color:var(--tx2);letter-spacing:.04em;
}
.badge-dot{
  width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.4)}50%{box-shadow:0 0 0 5px rgba(52,211,153,0)}}

/* ── Heading ── */
.form-hd{margin-bottom:24px}
.form-title{
  font-family:var(--fd);font-weight:900;font-size:1.5rem;color:var(--tx);
  letter-spacing:-.025em;line-height:1.12;margin-bottom:4px;
}
.form-title em{color:var(--tx2);font-style:normal}
.form-sub{font-size:.74rem;color:var(--tx3);line-height:1.5}

/* ── Alert ── */
.alert{
  display:none;align-items:flex-start;gap:9px;
  padding:11px 13px;margin-bottom:16px;
  border-radius:var(--r);font-size:.72rem;color:var(--tx2);
  line-height:1.5;border:1px solid;
}
.alert.show{display:flex}
.alert.err{background:var(--redd);border-color:rgba(244,63,94,.18)}
.alert.ok{background:rgba(52,211,153,.07);border-color:rgba(52,211,153,.2)}
.alert strong{display:block;font-size:.68rem;font-weight:700;margin-bottom:2px}
.alert.err strong{color:var(--red)}
.alert.ok  strong{color:var(--green)}

/* ── Fields ── */
.field{position:relative;margin-bottom:13px}
.lbl{
  font-size:.56rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--tx3);display:block;margin-bottom:6px;font-weight:700;
}
.inp{
  width:100%;background:var(--s1);border:1px solid var(--b);
  border-radius:var(--r);color:var(--tx);font-family:var(--fs);font-size:.86rem;
  padding:12px 14px;outline:none;
  transition:border-color var(--tf),box-shadow var(--tf),background var(--tf);
}
.inp:focus{border-color:var(--bh);box-shadow:0 0 0 3px rgba(255,255,255,.04);background:var(--s2)}
.inp.has-eye{padding-right:46px}
.inp.err{border-color:rgba(244,63,94,.45);animation:shake .3s ease}
.inp::placeholder{color:var(--tx3)}
@keyframes shake{0%,100%{transform:translateX(0)}22%,66%{transform:translateX(-4px)}44%,88%{transform:translateX(4px)}}
.field-err{font-size:.62rem;color:var(--red);margin-top:5px;display:none}
.field-err.show{display:block}

/* ── Phone field ── */
.phone-field{
  display:flex;align-items:stretch;
  background:var(--s1);border:1px solid var(--b);
  border-radius:var(--r);overflow:hidden;
  transition:border-color var(--tf),box-shadow var(--tf),background var(--tf);
}
.phone-field:focus-within{
  border-color:var(--bh);
  box-shadow:0 0 0 3px rgba(255,255,255,.04);
  background:var(--s2);
}
.phone-prefix{
  display:flex;align-items:center;gap:7px;padding:0 13px;
  background:var(--s2);border-right:1px solid var(--b);
  font-family:var(--fs);font-weight:700;font-size:.84rem;color:var(--tx2);
  flex-shrink:0;user-select:none;
}
.phone-flag{
  width:14px;height:21px;border-radius:2px;flex-shrink:0;
  box-shadow:0 0 0 1px rgba(255,255,255,.1);object-fit:cover;display:block;
}
.phone-input{
  flex:1;min-width:0;border:none;background:none;outline:none;
  color:var(--tx);font-family:var(--fs);font-size:.86rem;font-weight:500;
  padding:12px 14px 12px 10px;letter-spacing:.03em;
}
.phone-input::placeholder{color:var(--tx3)}

/* ── Eye ── */
.eye{
  position:absolute;right:0;bottom:0;width:44px;height:44px;
  background:none;border:none;cursor:pointer;color:var(--tx3);
  display:flex;align-items:center;justify-content:center;transition:color var(--tf);
}
.eye:hover{color:var(--tx2)}

/* ── Opt row ── */
.opt-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.remember{
  display:flex;align-items:center;gap:7px;
  font-size:.68rem;color:var(--tx2);cursor:pointer;user-select:none;
}
.remember input{accent-color:#fff;cursor:pointer;width:12px;height:12px}
.support-link{
  font-size:.68rem;color:var(--tx3);background:none;border:none;
  cursor:pointer;font-family:var(--fs);padding:0;
  text-decoration:none;transition:color var(--tf);
}
.support-link:hover{color:var(--tx2)}

/* ── Submit ── */
.btn-submit{
  width:100%;padding:13px;border-radius:var(--r);
  background:#fff;border:none;
  color:#111;font-family:var(--fd);font-weight:900;
  font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:opacity var(--tf),transform var(--tf);
}
.btn-submit:hover:not(:disabled){opacity:.88;transform:translateY(-1px)}
.btn-submit:active:not(:disabled){transform:scale(.98)}
.btn-submit:disabled{opacity:.22;cursor:not-allowed;transform:none}
.btn-submit.loading .btn-txt{opacity:.4}
.spinner{
  width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(0,0,0,.2);border-top-color:#111;
  animation:spin .7s linear infinite;display:none;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-submit.loading .spinner{display:block}

/* ── Divider ── */
.divider{height:1px;background:var(--b);margin:22px 0}

/* ── Security notice ── */
.sec-notice{
  display:flex;align-items:flex-start;gap:9px;
  font-size:.63rem;color:var(--tx3);line-height:1.65;
}
.sec-notice svg{flex-shrink:0;margin-top:1px}

/* ── Status ── */
.status-bar{
  display:flex;align-items:center;gap:7px;margin-top:20px;
  font-family:var(--fm);font-size:.56rem;color:var(--tx3);letter-spacing:.04em;
}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--s3);flex-shrink:0;transition:background .3s}
.status-dot.ok{background:var(--green)}
.status-dot.err{background:var(--red)}
</style>
</head>
<body>

<div class="fb-bar" id="fb-bar"></div>

<div class="wrap">

        <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>

  <button class="btn-submit" id="btn-login" type="button">

    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    Только для авторизованных сотрудников с ролью <strong style="color:var(--tx2)">admin</strong>. Все действия записываются в журнал аудита.
  </div>

  <div class="status-bar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-txt">Подключение к Firebase…</span>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged,
  setPersistence, browserLocalPersistence, browserSessionPersistence,
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, serverTimestamp,
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

const cfg = {
  apiKey:            'AIzaSyCjIAMFuwLKwmjChCuiz-MHLv5WZOczAAE',
  authDomain:        'delivery-galelium.firebaseapp.com',
  projectId:         'delivery-galelium',
  storageBucket:     'delivery-galelium.firebasestorage.app',
  messagingSenderId: '982466555080',
  appId:             '1:982466555080:web:c77ccbff0e71e540ddc9fd',
};
const app  = initializeApp(cfg);
const auth = getAuth(app);
const db   = getFirestore(app);

const ADMIN_HOME   = 'dashboard.html';
const PHONE_DOMAIN = 'phone.dastdaroz.id';

// ─────────────────────────────────────────────────────────────
//  Rate Limiter (in-memory + sessionStorage)
//  5 неудачных попыток → 30с → 2м → 15м → 1ч
// ─────────────────────────────────────────────────────────────
const RL = (() => {
  const SK          = 'adm_rl_v1';
  const MAX_FAILS   = 5;
  const WIN_MS      = 15 * 60_000;
  const LOCKOUTS_MS = [30_000, 120_000, 900_000, 3_600_000];
  const G_MAX       = 20;
  const G_WIN_MS    = 10 * 60_000;

  const load = () => { try { return JSON.parse(sessionStorage.getItem(SK) || '{}'); } catch { return {}; } };
  const save = s  => { try { sessionStorage.setItem(SK, JSON.stringify(s)); } catch {} };

  function check(key) {
    const now = Date.now(), s = load(), e = s[key];
    if (!e) return { ok: true, fails: 0 };
    if (e.until && now < e.until) return { ok: false, until: e.until };
    if (!e.until && now - e.first > WIN_MS) { delete s[key]; save(s); return { ok: true, fails: 0 }; }
    return { ok: true, fails: e.fails || 0 };
  }

  function fail(key) {
    const now = Date.now(), s = load();
    let e = s[key];
    if (!e || (!e.until && now - e.first > WIN_MS)) e = { fails: 0, lockouts: 0, first: now };
    if (e.until && now >= e.until) { e.fails = 0; delete e.until; e.first = now; }
    e.fails = (e.fails || 0) + 1;
    if (e.fails >= MAX_FAILS) {
      const dur = LOCKOUTS_MS[Math.min(e.lockouts, LOCKOUTS_MS.length - 1)];
      e.until = now + dur;
      e.lockouts = (e.lockouts || 0) + 1;
      e.fails = 0; e.first = now;
    }
    s[key] = e; save(s);
    return check(key);
  }

  function success(key) { const s = load(); delete s[key]; save(s); }

  function checkGlobal() {
    const now = Date.now(), s = load();
    const g = s['__g'] || { t: [] };
    g.t = g.t.filter(x => now - x < G_WIN_MS);
    if (g.t.length >= G_MAX) { s['__g'] = g; save(s); return false; }
    g.t.push(now); s['__g'] = g; save(s);
    return true;
  }

  return { check, fail, success, checkGlobal, MAX_FAILS };
})();

// Countdown при блокировке
let _cdTimer = null;
function startLockout(until) {
  if (_cdTimer) clearInterval(_cdTimer);
  setLoading(false);
  document.getElementById('btn-login').disabled = true;
  const tick = () => {
    const sec = Math.ceil((until - Date.now()) / 1000);
    if (sec <= 0) {
      clearInterval(_cdTimer); _cdTimer = null;
      document.getElementById('btn-login').disabled = false;
      hideAlert(); return;
    }
    const m = Math.floor(sec / 60), s = sec % 60;
    const t = m > 0 ? `${m}:${String(s).padStart(2,'0')}` : `${s} сек`;
    showAlert('Доступ временно ограничен', `Слишком много неудачных попыток. Повторите через: ${t}`);
  };
  tick(); _cdTimer = setInterval(tick, 1000);
}

// ─────────────────────────────────────────────────────────────
//  Phone helpers (та же логика что в клиентском login)
// ─────────────────────────────────────────────────────────────
function digitsOnly(v) { return (v || '').replace(/\D/g, ''); }

function normalizePhone(raw) {
  let d = digitsOnly(raw);
  if (d.startsWith('992')) d = d.slice(3);
  else if (d.startsWith('8') && d.length === 10) d = d.slice(1);
  if (d.length !== 9) return null;
  return d;
}

function phoneToPseudoEmail(d9) { return `992${d9}@${PHONE_DOMAIN}`; }

// Маска: "90 123 45 67"
const phoneInput = document.getElementById('l-phone');
phoneInput.addEventListener('input', () => {
  let d = digitsOnly(phoneInput.value).slice(0, 9), out = '';
  if (d.length > 0) out  = d.slice(0, 2);
  if (d.length > 2) out += ' ' + d.slice(2, 5);
  if (d.length > 5) out += ' ' + d.slice(5, 7);
  if (d.length > 7) out += ' ' + d.slice(7, 9);
  phoneInput.value = out;
});

// ─────────────────────────────────────────────────────────────
//  DOM helpers
// ─────────────────────────────────────────────────────────────
const statusDot = document.getElementById('status-dot');
const statusTxt = document.getElementById('status-txt');
const fbBar     = document.getElementById('fb-bar');

function showAlert(title, msg, type = 'err') {
  document.getElementById('alert-title').textContent = title;
  document.getElementById('alert-msg').textContent   = ' ' + msg;
  document.getElementById('alert').className = `alert ${type} show`;
}
function hideAlert() { document.getElementById('alert').className = 'alert err'; }

function showFieldErr(id, msg) {
  const inp = document.getElementById(id);
  const err = document.getElementById('err-' + id);
  if (inp) inp.classList.add('err');
  if (err) { err.textContent = msg; err.classList.add('show'); }
}
function clearFieldErr(id) {
  const inp = document.getElementById(id);
  const err = document.getElementById('err-' + id);
  if (inp) inp.classList.remove('err');
  if (err) { err.textContent = ''; err.classList.remove('show'); }
}

[phoneInput, document.getElementById('l-pass')].forEach(el => {
  el.addEventListener('input', () => {
    if (_cdTimer) return;
    clearFieldErr(el.id); hideAlert();
  });
});

function setLoading(on) {
  const btn = document.getElementById('btn-login');
  btn.disabled = on;
  btn.classList.toggle('loading', on);
}

// Eye toggle
document.getElementById('eye-login').addEventListener('click', () => {
  const inp = document.getElementById('l-pass');
  const vis = inp.type === 'password';
  inp.type = vis ? 'text' : 'password';
  document.getElementById('eye-login-show').style.display = vis ? 'none' : '';
  document.getElementById('eye-login-hide').style.display = vis ? '' : 'none';
});

// Firebase error messages
function fbMsg(code) {
  const m = {
    'auth/user-not-found':            ['Аккаунт не найден',    'Нет аккаунта с таким номером телефона.'],
    'auth/wrong-password':            ['Неверный пароль',       'Проверьте правильность пароля.'],
    'auth/invalid-credential':        ['Неверные данные',       'Номер телефона или пароль введены неправильно.'],
    'auth/invalid-login-credentials': ['Неверные данные',       'Номер телефона или пароль введены неправильно.'],
    'auth/too-many-requests':         ['Слишком много попыток', 'Firebase временно заблокировал вход. Попробуйте позже.'],
    'auth/network-request-failed':    ['Ошибка сети',           'Проверьте подключение к интернету.'],
    'no-admin':                       ['Нет прав доступа',      'Этот аккаунт не имеет роли admin. Обратитесь к администратору.'],
  };
  return m[code] || ['Ошибка', 'Что-то пошло не так. Попробуйте ещё раз.'];
}

// ─────────────────────────────────────────────────────────────
//  Auth state
// ─────────────────────────────────────────────────────────────
fbBar.classList.add('loading');
onAuthStateChanged(auth, async user => {
  fbBar.classList.remove('loading');
  fbBar.classList.add('done');
  if (!user) {
    statusDot.className  = 'status-dot ok';
    statusTxt.textContent = 'dastdaroz · Firebase подключён';
    return;
  }
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (snap.exists() && snap.data().role === 'admin') {
      statusDot.className  = 'status-dot ok';
      statusTxt.textContent = `Авторизован (${snap.data().displayName || user.uid}) — переход…`;
      setTimeout(() => location.href = ADMIN_HOME, 600);
    } else {
      // Авторизован, но не admin — выходим
      await auth.signOut();
      statusDot.className  = 'status-dot ok';
      statusTxt.textContent = 'dastdaroz · Firebase подключён';
    }
  } catch {
    statusDot.className  = 'status-dot ok';
    statusTxt.textContent = 'dastdaroz · Firebase подключён';
  }
});

// ─────────────────────────────────────────────────────────────
//  LOGIN
// ─────────────────────────────────────────────────────────────
const WRONG_PASS = new Set([
  'auth/wrong-password',
  'auth/invalid-credential',
  'auth/invalid-login-credentials',
]);

document.getElementById('btn-login').addEventListener('click', async () => {
  // Сбрасываем ошибки
  clearFieldErr('l-phone');
  clearFieldErr('l-pass');
  hideAlert();

  // Валидация
  const d9   = normalizePhone(phoneInput.value);
  const pass = document.getElementById('l-pass').value;
  let bad = false;
  if (!d9)   { showFieldErr('l-phone', 'Введите номер телефона (9 цифр)'); bad = true; }
  if (!pass) { showFieldErr('l-pass',  'Введите пароль'); bad = true; }
  if (bad) return;

  // Rate limit: глобальный
  if (!RL.checkGlobal()) {
    showAlert('Слишком много попыток', 'Подождите немного и попробуйте снова.');
    return;
  }

  // Rate limit: per-phone
  const key     = phoneToPseudoEmail(d9);
  const rlState = RL.check(key);
  if (!rlState.ok) { startLockout(rlState.until); return; }

  setLoading(true);
  try {
    const pers = document.getElementById('remember').checked
      ? browserLocalPersistence
      : browserSessionPersistence;
    await setPersistence(auth, pers);

    const cred = await signInWithEmailAndPassword(auth, key, pass);

    // Проверяем роль строго: только 'admin'
    const snap = await getDoc(doc(db, 'users', cred.user.uid));
    if (!snap.exists() || snap.data().role !== 'admin') {
      await auth.signOut();
      const [t, m] = fbMsg('no-admin');
      showAlert(t, m);
      setLoading(false);
      return;
    }

    // Обновляем lastLoginAt
    await setDoc(doc(db, 'users', cred.user.uid), {
      lastLoginAt: serverTimestamp(),
    }, { merge: true });

    RL.success(key);
    // onAuthStateChanged → redirect

  } catch (e) {
    if (WRONG_PASS.has(e.code)) {
      const res    = RL.fail(key);
      const [t, m] = fbMsg(e.code);
      if (!res.ok) {
        startLockout(res.until);
      } else {
        const left = RL.MAX_FAILS - res.fails;
        showAlert(t, m + (left <= 2 ? ` (осталось попыток: ${left})` : ''));
        document.getElementById('l-pass').value = '';
        setLoading(false);
      }
    } else {
      const [t, m] = fbMsg(e.code);
      showAlert(t, m);
      document.getElementById('l-pass').value = '';
      setLoading(false);
    }
  }
});

// Enter key
phoneInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('l-pass').focus();
});
document.getElementById('l-pass').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-login').click();
});
</script>
</body>
